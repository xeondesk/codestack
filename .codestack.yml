image: codestack/workspace-node
tasks:
  - init: |
      bun install
    name: Compile codestack-shared
    command: |
      bun run --filter=codestack-shared compile
      gp sync-done shared
      bun run --filter=codestack-shared watch
  - name: Compile codestack-web
    command: |
      gp sync-await shared
      bun run --filter=codestack-web watch
  - name: Compile codestack-remote
    command: |
      gp sync-await shared
      bun run --filter=codestack-remote-ssh watch

vscode:
  extensions:
    - dbaeumer.vscode-eslint
    - svelte.svelte-vscode
