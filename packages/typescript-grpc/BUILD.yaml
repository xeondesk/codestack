packages:
  - name: lib
    type: yarn
    srcs:
      - package.json
      - build.sh
    deps:
      - packages/supervisor-api:proto
    env:
      - PROTOLOC=packages/supervisor-api--proto
    config:
      packaging: library
      dontTest: true
      commands:
        build: ["yarn", "build"]
      yarnLock: ${coreYarnLockBase}/../yarn.lock
      tsconfig: tsconfig.json
  - name: publish
    type: generic
    env:
      - DO_PUBLISH=${publishToNPM}
    argdeps:
      - npmPublishTrigger
    deps:
      - :lib
      - packages/codestack-protocol:scripts
    config:
      commands:
        - ["node", "packages/codestack-protocol/scripts/publish.js", "${version}", "packages/supervisor-api-typescript-grpc/lib/package"]
